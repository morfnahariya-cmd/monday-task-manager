<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגשת משימה</title>
    <style>
        :root {
            --primary: #0073ea;
            --primary-hover: #0060c4;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #323338;
            --border: #c3c6d4;
            --error: #d9381e;
            --success: #00854d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .form-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
            padding: 32px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #c3c6d4;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .status-msg.success {
            background-color: #e6f4ed;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-msg.error {
            background-color: #fcebe8;
            color: var(--error);
            border: 1px solid var(--error);
        }

        .subitem-note {
            font-size: 12px;
            color: #676879;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>הגשת משימה חדשה</h2>
    <form id="taskForm">
        <div class="form-group">
            <label for="boardSelect">בחר לוח/תחום *</label>
            <select id="boardSelect" required>
                <option value="">-- בחר לוח --</option>
                <option value="permits">היתרי בניה</option>
                <option value="plans">תכניות</option>
                <option value="projects">משימות - ניהול פרוייקטים</option>
                <option value="inspection">משימות - פיקוח על הבניה</option>
            </select>
        </div>

        <div class="form-group" id="parentGroup" style="display:none;">
            <label for="parentSelect">פרויקט/תכנית מקושרת *</label>
            <select id="parentSelect">
                <option value="">-- בחר פרויקט --</option>
            </select>
            <div class="subitem-note">המשימה תיווצר כתת-משימה (Subitem) תחת הפרויקט הנבחר.</div>
        </div>

        <div class="form-group">
            <label for="taskName">תיאור המשימה *</label>
            <input type="text" id="taskName" required placeholder="הזן תיאור משימה...">
        </div>

        <div class="form-group">
            <label for="requesterSelect">מבקש המשימה *</label>
            <select id="requesterSelect" required>
                <option value="">טוען משתמשים...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="assigneeSelect">באחריות (אחראי לביצוע)</label>
            <select id="assigneeSelect">
                <option value="">-- ללא משויך --</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">שלח משימה</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

    async function mondayApi(query) {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': API_KEY,
                'API-Version': '2023-10'
            },
            body: JSON.stringify({ query })
        });
        return await res.json();
    }
