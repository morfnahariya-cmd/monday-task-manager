<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל משימות - אגף הנדסה</title>
    <style>
        :root {
            --primary: #0073ea;
            --primary-hover: #0060c4;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #323338;
            --border: #c3c6d4;
            --error: #d9381e;
            --success: #00854d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .form-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
            padding: 32px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text);
            font-size: 24px;
        }

        .board-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .board-btn {
            background-color: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .board-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .board-btn.active {
            background-color: #e5f0ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }

        button.submit-btn:disabled {
            background-color: #c3c6d4;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .status-msg.success {
            background-color: #e6f4ed;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-msg.error {
            background-color: #fcebe8;
            color: var(--error);
            border: 1px solid var(--error);
        }

        .subitem-note {
            font-size: 12px;
            color: #676879;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>הגשת משימה חדשה</h2>

    <label>בחר לוח/תחום: *</label>
    <div class="board-buttons">
        <button type="button" class="board-btn" data-value="permits">היתרי בניה</button>
        <button type="button" class="board-btn" data-value="plans">תכניות</button>
        <button type="button" class="board-btn" data-value="projects">ניהול פרוייקטים</button>
        <button type="button" class="board-btn" data-value="inspection">פיקוח על הבניה</button>
    </div>

    <form id="taskForm">
        <input type="hidden" id="selectedBoard" required>

        <div class="form-group" id="parentGroup" style="display:none;">
            <label for="parentSelect">פרויקט/תכנית מקושרת *</label>
            <select id="parentSelect">
                <option value="">-- בחר פרויקט --</option>
            </select>
            <div class="subitem-note">המשימה תיווצר כתת-משימה (Subitem) תחת הפרויקט הנבחר.</div>
        </div>

        <div class="form-group">
            <label for="taskName">תיאור המשימה *</label>
            <input type="text" id="taskName" required placeholder="הזן תיאור משימה...">
        </div>

        <div class="form-group">
            <label for="requesterSelect">מבקש המשימה *</label>
            <select id="requesterSelect" required>
                <option value="">טוען משתמשים...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="assigneeSelect">באחריות (אחראי לביצוע)</label>
            <select id="assigneeSelect">
                <option value="">-- ללא משויך --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="prioritySelect">עדיפות</label>
            <select id="prioritySelect">
                <option value="Low">נמוכה</option>
                <option value="Medium" selected>בינונית</option>
                <option value="High">גבוהה</option>
            </select>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">שלח משימה</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

<script>
    const API_URL = "https://api.monday.com/v2";
    const API_KEY = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjE0MTkxNjc0LCJ1aWQiOjUyMzYzODUwLCJpYWQiOiIyMDI0LTEwLTEwVDExOjMyOjA4LjAwMFoiLCJwZXIiOiJmdWxsIiwiYWN0aW9uIjoicmVhZDp3cml0ZSIsImFwcF9pZCI6MCwianRpIjoiZmFmNTZkMDgtYmE2OC00MDc0LTlhNmItNmY0ZDRlODk2MzdiIn0.9qK4mP6j4M0R9qZ5P8N3X6y8z7w6v5u4t3s2r1q0p9o";

    const BOARDS_CONFIG = {
        permits: { id: "1675713838", isSubitem: true, requesterCol: "multiple_person_mm84fek5", assigneeCol: "person" },
        plans: { id: "1675714041", isSubitem: true, requesterCol: "multiple_person_mm84fek5", assigneeCol: "person" },
        projects: { id: "1675714243", isSubitem: false, requesterCol: "multiple_person_mm84fek5", assigneeCol: "person" },
        inspection: { id: "1675714402", isSubitem: false, requesterCol: "multiple_person_mm84fek5", assigneeCol: "person" }
    };

    let usersList = [];

    async function mondayApi(query) {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': API_KEY,
                'API-Version': '2023-10'
            },
            body: JSON.stringify({ query })
        });
        return await res.json();
    }

    async function loadUsers() {
        const query = `{ users (limit: 200) { id name } }`;
        try {
            const res = await mondayApi(query);
            if (res.data && res.data.users) {
                usersList = res.data.users;
                populateUserDropdowns();
            }
        } catch (e) {
            console.error("Error loading users:", e);
        }
    }

    function populateUserDropdowns() {
        const reqSelect = document.getElementById('requesterSelect');
        const assSelect = document.getElementById('assigneeSelect');

        reqSelect.innerHTML = '<option value="">-- בחר מבקש --</option>';
        assSelect.innerHTML = '<option value="">-- ללא משויך --</option>';

        usersList.forEach(u => {
            reqSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`;
            assSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`;
        });

        checkAutoSelectRequester();
    }

    function checkAutoSelectRequester() {
        const urlParams = new URLSearchParams(window.location.search);
        const requesterParam = urlParams.get('requester');
        if (requesterParam && (requesterParam.toLowerCase() === 'tal' || requesterParam.toLowerCase() === 'tal_chami' || requesterParam === 'טל')) {
            const reqSelect = document.getElementById('requesterSelect');
            for (let i = 0; i < reqSelect.options.length; i++) {
                if (reqSelect.options[i].text.includes('טל') || reqSelect.options[i].text.includes('Tal')) {
                    reqSelect.selectedIndex = i;
                    break;
                }
            }
        }
    }

    // ניהול 4 הכפתורים למעלה
    document.querySelectorAll('.board-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            document.querySelectorAll('.board-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const boardKey = this.getAttribute('data-value');
            document.getElementById('selectedBoard').value = boardKey;

            const parentGroup = document.getElementById('parentGroup');
            const parentSelect = document.getElementById('parentSelect');

            const config = BOARDS_CONFIG[boardKey];
            if (config.isSubitem) {
                parentGroup.style.display = 'block';
                parentSelect.required = true;
                parentSelect.innerHTML = '<option value="">טוען פרויקטים...</option>';

                const query = `{ boards (ids: [${config.id}]) { items_page (limit: 100) { items { id name } } } }`;
                try {
                    const res = await mondayApi(query);
                    const items = res.data.boards[0].items_page.items;
                    parentSelect.innerHTML = '<option value="">-- בחר פרויקט --</option>';
                    items.forEach(item => {
                        parentSelect.innerHTML += `<option value="${item.id}">${item.name}</option>`;
                    });
                } catch (e) {
                    parentSelect.innerHTML = '<option value="">שגיאה בטעינת פרויקטים</option>';
                }
            } else {
                parentGroup.style.display = 'none';
                parentSelect.required = false;
            }
        });
    });

    document.getElementById('taskForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const boardKey = document.getElementById('selectedBoard').value;

        if (!boardKey) {
            alert('אנא בחר אחד מארבעת התחומים/הלוחות למעלה');
            return;
        }

        submitBtn.disabled = true;
        statusMsg.style.display = 'none';

        const config = BOARDS_CONFIG[boardKey];
        const taskName = document.getElementById('taskName').value;
        const requesterId = document.getElementById('requesterSelect').value;
        const assigneeId = document.getElementById('assigneeSelect').value;

        const columnValues = {};
        if (requesterId) {
            columnValues[config.requesterCol] = { personsAndTeams: [{ id: parseInt(requesterId), kind: "person" }] };
        }
        if (assigneeId) {
            columnValues[config.assigneeCol] = { personsAndTeams: [{ id: parseInt(assigneeId), kind: "person" }] };
        }

        const jsonValues = JSON.stringify(JSON.stringify(columnValues));

        let query = "";
        if (config.isSubitem) {
            const parentId = document.getElementById('parentSelect').value;
            query = `mutation { create_subitem (parent_item_id: ${parentId}, item_name: "${taskName}", column_values: ${jsonValues}) { id } }`;
        } else {
            query = `mutation { create_item (board_id: ${config.id}, item_name: "${taskName}", column_values: ${jsonValues}) { id } }`;
        }

        try {
            const res = await mondayApi(query);
            if (res.data) {
                statusMsg.className = "status-msg success";
                statusMsg.innerText = "ההמשימה נשלחה בהצלחה!";
                statusMsg.style.display = 'block';
                document.getElementById('taskForm').reset();
                document.querySelectorAll('.board-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('selectedBoard').value = '';
                document.getElementById('parentGroup').style.display = 'none';
                checkAutoSelectRequester();
            } else {
                throw new Error("API Error");
            }
        } catch (e) {
            statusMsg.className = "status-msg error";
            statusMsg.innerText = "אירעה שגיאה בשליחת המשימה. אנא נסה שנית.";
            statusMsg.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
        }
    });

    loadUsers();
</script>

</body>
</html>
