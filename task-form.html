<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגשת משימה חדשה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            color: #333333;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444444;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #0073ea;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0073ea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0060c4;
        }
        #status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>הגשת משימה חדשה</h2>
    <form id="taskForm">
        <div class="form-group">
            <label for="boardSelect">בחר לוח/תחום:</label>
            <select id="boardSelect" required onchange="onBoardChange()">
                <option value="">-- בחר לוח --</option>
                <option value="permits">היתרי בניה</option>
                <option value="plans">תכניות</option>
                <option value="projects">משימות - ניהול פרוייקטים</option>
                <option value="inspection">משימות - פיקוח על הבניה</option>
            </select>
        </div>

        <div class="form-group">
            <label for="taskTitle">שם המשימה / הפרויקט:</label>
            <input type="text" id="taskTitle" required placeholder="הזן תיאור קצר...">
        </div>

        <div class="form-group">
            <label for="requesterSelect">מבקש המשימה:</label>
            <select id="requesterSelect" required>
                <option value="">-- בחר מבקש --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="assigneeSelect">באחריות (אחראי לביצוע):</label>
            <select id="assigneeSelect">
                <option value="">-- בחר אחראי --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="prioritySelect">עדיפות:</label>
            <select id="prioritySelect">
                <option value="Low">נמוכה</option>
                <option value="Medium" selected>בינונית</option>
                <option value="High">גבוהה</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">שלח משימה</button>
    </form>

    <div id="status-message"></div>
</div>

<script>
    // זיהוי פרמטר requester מה-URL (למשל ?requester=tal)
    function autoSelectTalIfRequested() {
        const urlParams = new URLSearchParams(window.location.search);
        const requesterParam = urlParams.get('requester');
        
        if (requesterParam && (requesterParam.toLowerCase() === 'tal' || requesterParam.toLowerCase() === 'tal_chami' || requesterParam === 'טל')) {
            const requesterSelect = document.getElementById('requesterSelect');
            for (let i = 0; i < requesterSelect.options.length; i++) {
                const optText = requesterSelect.options[i].text;
                if (optText.includes('טל') || optText.includes('Tal')) {
                    requesterSelect.selectedIndex = i;
                    break;
                }
            }
        }
    }

    // הפעלת הבדיקה גם בטעינה וגם כשמשתנה הלוח
    window.addEventListener('DOMContentLoaded', () => {
        autoSelectTalIfRequested();
    });

    function onBoardChange() {
        // לאחר טעינת האפשרויות של הלוח:
        setTimeout(autoSelectTalIfRequested, 300);
    }
</script>

</body>
</html>
