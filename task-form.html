<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל משימות - מנהל הנדסה</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #1f2937; margin-bottom: 25px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 500px; overflow-x: auto; padding-bottom: 5px; }
        .tab { flex: 1; min-width: 90px; text-align: center; padding: 10px 5px; background: #e5e7eb; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; color: #4b5563; font-size: 13px; white-space: nowrap; }
        .tab.active { background: #0073ea; color: white; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
        label.required::after { content: " *"; color: #e11d48; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #0073ea; }
        button.submit-btn { width: 100%; padding: 12px; background: #0073ea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.submit-btn:hover { background: #005bb5; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab active" onclick="switchBoard('permits')">היתרי בניה</button>
        <button class="tab" onclick="switchBoard('plans')">תוכניות</button>
        <button class="tab" onclick="switchBoard('projects')">ניהול פרויקטים</button>
        <button class="tab" onclick="switchBoard('supervision')">פיקוח על הבניה</button>
    </div>

    <div class="container">
        <h2>הוספת משימה חדשה</h2>
        <form id="taskForm">
            <div class="form-group">
                <label class="required" for="taskName">מה המשימה?</label>
                <div style="position: relative;">
                    <input type="text" id="taskName" required placeholder="הקלד/הקלט תיאור משימה..." style="padding-left: 40px;">
                    <button type="button" id="micBtn" onclick="toggleSpeechRecognition()" title="הקלטה קולית" style="position: absolute; left: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px;">🔊</button>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="projectSelect">שם הפרויקט</label>
                <select id="projectSelect" required>
                    <option value="">טוען פרויקטים...</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required" for="requesterSelect">מבקש המשימה</label>
                <select id="requesterSelect" required>
                    <option value="">טוען משתמשים...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="assigneeSelect">באחריות</label>
                <select id="assigneeSelect">
                    <option value="">טוען אחראי/ת...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dueDate">מועד לביצוע</label>
                <input type="date" id="dueDate">
            </div>

            <div class="form-group">
                <label for="prioritySelect">עדיפות</label>
                <select id="prioritySelect">
                    <option value="בינוני">בינוני</option>
                    <option value="גבוה">גבוה</option>
                    <option value="דחוף">דחוף</option>
                    <option value="נמוך">נמוך</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">הוסף משימה</button>
        </form>
    </div>

    <script>
        const MONDAY_API_KEY = "YOUR_MONDAY_API_KEY_HERE"; // ודאי שמפתח ה-API שלך מוגדר כאן
        
        const BOARDS_CONFIG = {
            permits: { type: 'item', boardId: '1835759755', projectsBoardId: '1835759755' },
            plans: { type: 'item', boardId: '1835759756', projectsBoardId: '1835759756' },
            projects: { type: 'item', boardId: '1835759757', projectsBoardId: '1835759757' },
            supervision: { type: 'item', boardId: '1835759758', projectsBoardId: '1835759758' }
        };

        let currentBoardKey = 'permits';

        async function initForm() {
            await Promise.all([
                loadProjects(),
                loadUsers()
            ]);
        }

        async function loadProjects() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '<option value="">טוען פרויקטים...</option>';
            
            const config = BOARDS_CONFIG[currentBoardKey];
            const targetBoardId = config.type === 'item' ? config.projectsBoardId : config.boardId;

            const query = `{
                boards(ids: [${targetBoardId}]) {
                    items_page(limit: 500) {
                        items {
                            id
                            name
                        }
                    }
                }
            }`;

            try {
                const res = await fetch("https://api.monday.com/v2", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": MONDAY_API_KEY
                    },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();

                if (!data.data || !data.data.boards || data.data.boards.length === 0) {
                    select.innerHTML = '<option value="">אין פרויקטים זמינים</option>';
                    return;
                }

                const boardData = data.data.boards[0];
                const items = (boardData.items_page && boardData.items_page.items) ? boardData.items_page.items : [];

                if (items.length === 0) {
                    select.innerHTML = '<option value="">אין פרויקטים זמינים</option>';
                    return;
                }

                items.sort((a, b) => a.name.localeCompare(b.name, 'he'));

                select.innerHTML = '<option value="">בחר פרויקט...</option>';
                items.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Error loading projects:", err);
                select.innerHTML = '<option value="">שגיאה בטעינת פרויקטים</option>';
            }
        }

        async function loadUsers() {
            const reqSelect = document.getElementById('requesterSelect');
            const assSelect = document.getElementById('assigneeSelect');
            
            reqSelect.innerHTML = '<option value="">טוען משתמשים...</option>';
            assSelect.innerHTML = '<option value="">טוען אחראי/ת...</option>';

            const query = `{
                users(limit: 500) {
                    id
                    name
                }
            }`;

            try {
                const res = await fetch("https://api.monday.com/v2", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": MONDAY_API_KEY
                    },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();

                if (!data.data || !data.data.users) {
                    reqSelect.innerHTML = '<option value="">שגיאה בטעינת משתמשים</option>';
                    assSelect.innerHTML = '<option value="">שגיאה בטעינת משתמשים</option>';
                    return;
                }

                const users = data.data.users;
                users.sort((a, b) => a.name.localeCompare(b.name, 'he'));

                reqSelect.innerHTML = '<option value="">בחר מבקש/ת משימה...</option>';
                assSelect.innerHTML = '<option value="">בחר אחראי/ת...</option>';

                users.forEach(user => {
                    let opt1 = document.createElement('option');
                    opt1.value = user.id;
                    opt1.textContent = user.name;
                    reqSelect.appendChild(opt1);

                    let opt2 = document.createElement('option');
                    opt2.value = user.id;
                    opt2.textContent = user.name;
                    assSelect.appendChild(opt2);
                });
            } catch (err) {
                console.error("Error loading users:", err);
                reqSelect.innerHTML = '<option value="">שגיאה בטעינה</option>';
                assSelect.innerHTML = '<option value="">שגיאה בטעינה</option>';
            }
        }

        function switchBoard(key) {
            currentBoardKey = key;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadProjects();
        }

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("הדפדפן שלך לא תומך בהקלטה קולית.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.interimResults = false;

            const micBtn = document.getElementById('micBtn');
            const taskInput = document.getElementById('taskName');

            micBtn.innerText = "🔴";

            recognition.onresult = function(event) {
                taskInput.value = event.results[0][0].transcript;
                micBtn.innerText = "🔊";
            };

            recognition.onerror = function() { micBtn.innerText = "🔊"; };
            recognition.onend = function() { micBtn.innerText = "🔊"; };

            recognition.start();
        }

        window.onload = initForm;
    </script>
</body>
</html>
